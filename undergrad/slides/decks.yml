  - section: "A cultural technology"
    sub: "Ted Underwood's more interesting upside"
  - quote: "Cultural technologies work by transmitting and enacting patterns of behavior. Other examples might include libraries, the printing press, or language itself."
    cite: "Ted Underwood, 2025"
    url: "https://tedunderwood.com/2025/07/02/a-more-interesting-upside-of-ai/"
  - quote: "Generative AI represents a second step change in our ability to map and edit culture. Now we can manipulate, not only specific texts and images, but the dispositions, tropes, genres, habits of thought, and patterns of interaction that create them."
    cite: "Ted Underwood, 2025"
    url: "https://tedunderwood.com/2025/07/02/a-more-interesting-upside-of-ai/"
  - quote: "My goal here is to convince people who use AI that “this is like writing” is potentially exciting—and to specify some of the things we would need to do to make it exciting."
    cite: "Ted Underwood, 2025"
    url: "https://tedunderwood.com/2025/07/02/a-more-interesting-upside-of-ai/"
  - quote: "A future where human beings have the ability to map and edit culture could be very dark. But I don’t think it will be boring or passively depressing. If we think this sounds boring, we’re not thinking hard enough."
    cite: "Ted Underwood, 2025"
    url: "https://tedunderwood.com/2025/07/02/a-more-interesting-upside-of-ai/"
