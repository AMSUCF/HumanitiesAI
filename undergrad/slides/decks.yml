# ENG 3861 lecture decks. Each module's title slide is generated from its
# front matter; everything after it is listed here, in order.
#
# Slide types (pick one key per slide; "notes" works on any slide):
#   section:  big divider text            (optional: sub)
#   quote:    verbatim quote              (cite, url; optional: label)
#   image:    repo path to an image       (alt, caption, credit_url)
#   points:   list of bullets             (title)
#   readings: list of {cite, what}        (optional: title)
#   prompt:   a prompt to type            (optional: title)
#   question: discussion question         (optional: hint)
# Inline text supports *italic*, **bold**, and [links](https://...).
# Every quote below was checked word-for-word against the source text.
# Rebuild after editing:  ../../.venv/Scripts/python build_decks.py

moduleone:
  - readings:
      - cite: "Matthew Kirschenbaum, [“What Is Digital Humanities and What’s It Doing in English Departments?”](https://mkirschenbaum.wordpress.com/wp-content/uploads/2011/03/ade-final.pdf) (2010)"
        what: "a short, classic introduction to the field"
      - cite: "Roman Mars, [“The ELIZA Effect”](https://99percentinvisible.org/episode/the-eliza-effect/), *99% Invisible* (2019)"
        what: "podcast + transcript: the first chatbot and the people who talked to it"
    notes: "Welcome students; this module is two weeks long, like every module. Point out the Activity Verification due Friday of week one."
  - section: "What is digital humanities?"
    sub: "computers + the study of literature, history, art, and culture"
  - quote: "At its core, then, digital humanities is more akin to a common methodological outlook than an investment in any one specific set of texts or even technologies."
    cite: "Matthew Kirschenbaum, 2010, p. 56"
    url: "https://mkirschenbaum.wordpress.com/wp-content/uploads/2011/03/ade-final.pdf"
  - quote: "Yet digital humanities is also a social undertaking. It harbors networks of people who have been working together, sharing research, arguing, competing, and collaborating for many years."
    cite: "Matthew Kirschenbaum, 2010, p. 56"
    url: "https://mkirschenbaum.wordpress.com/wp-content/uploads/2011/03/ade-final.pdf"
  - quote: "I also appreciated the fact that it seemed to cast a wider net than “humanities computing” which seemed to imply a form of computing, whereas “digital humanities” implied a form of humanism."
    cite: "Brett Bobley (NEH), quoted in Kirschenbaum, 2010, p. 57"
    url: "https://mkirschenbaum.wordpress.com/wp-content/uploads/2011/03/ade-final.pdf"
    notes: "The name matters: DH is humanism that uses computing, not computing that happens to touch the humanities."
  - quote: "First, after numeric input, text has been by far the most tractable data type for computers to manipulate."
    cite: "Matthew Kirschenbaum, 2010, p. 60"
    url: "https://mkirschenbaum.wordpress.com/wp-content/uploads/2011/03/ade-final.pdf"
    notes: "One of Kirschenbaum's reasons DH found a home in English departments. It's also why the first chatbots were text-only."
  - section: "Talking to machines"
    sub: "from the imitation game to ELIZA"
  - image: slides/media/fe5635c204a5.jpg
    alt: "Diagram of the imitation game: a computer labeled A and a person labeled B sit behind a wall, each passing a paper slip to a person labeled C who must judge which is which."
    caption: "Turing's imitation game (1950): can a judge tell the machine from the person by text alone?"
  - image: slides/media/9f494db4f284.jpg
    alt: "Dark terminal screen with a block-letter ELIZA banner and a transcript that begins 'Is something troubling you?' and 'Men are all alike.'"
    caption: "ELIZA (1966): Joseph Weizenbaum's script turns your words back into questions"
  - quote: "After two or three interchanges with the machine, she turned to me and she said, “Would you mind leaving the room please?”"
    cite: "Joseph Weizenbaum, archival recording in “The ELIZA Effect”"
    url: "https://99percentinvisible.org/episode/the-eliza-effect/transcript"
    notes: "Weizenbaum's secretary, who knew exactly how the program worked, still wanted privacy with it."
  - quote: "What I had not realized is that extremely short exposures to a relatively simple computer program could induce powerful, delusional thinking in quite normal people."
    cite: "Joseph Weizenbaum, read by Roman Mars in “The ELIZA Effect”"
    url: "https://99percentinvisible.org/episode/the-eliza-effect/transcript"
  - quote: "There’s even a term that’s emerged in computer science – ‘the ELIZA effect’ – that refers to our tendency to anthropomorphize computers and to believe that programs understand, even when they really don’t."
    cite: "Delaney Hall, “The ELIZA Effect”"
    url: "https://99percentinvisible.org/episode/the-eliza-effect/transcript"
  - image: slides/media/be837a014f67.png
    alt: "Built In article header 'What Is the Eliza Effect?' over an illustration of a woman's face merging into a faceted digital face."
    caption: "The ELIZA effect: reading a mind into a machine that only matches patterns"
  - quote: "Here you have somebody who so needs a landing pad for her feelings that she’s willing to embrace it, right? And he totally misses that, he totally misses the human need and instead speaks of just evidence of this person’s stupidity rather than evidence of their humanity."
    cite: "Miriam Weizenbaum, “The ELIZA Effect”"
    url: "https://99percentinvisible.org/episode/the-eliza-effect/transcript"
    notes: "A humanities move: Weizenbaum's daughter rereads the famous anecdote from the secretary's point of view."
  - section: "Machines that write"
    sub: "chatbots kept getting stranger"
  - image: slides/media/7128dee9c4f8.jpg
    alt: "Red book cover reading 'The Policeman's Beard Is Half Constructed: Computer prose and poetry by Racter,' with a collage portrait and the tagline 'The First Book Ever Written by a Computer.'"
    caption: "Racter's *The Policeman's Beard Is Half Constructed* (1984), billed as the first book written by a computer"
  - image: slides/media/04f53e771694.png
    alt: "Black screen of white monospaced text in which the program muses 'I am a computer, not some lamb or chicken or beef. Can I skip to my attourney?'"
    caption: "Racter talks about itself, 1980s style"
    credit_url: "https://www.atariarchives.org/deli/write_about_itself.php"
  - image: slides/media/b14d03f7d58d.png
    alt: "Article header '20 Years after Deep Blue: How AI Has Advanced Since Conquering Chess' above a photo of Garry Kasparov leaning over a chessboard."
    caption: "Kasparov vs. IBM's Deep Blue, 1997: AI as a contest with humans"
  - quote: "I think we’re all a little like Dr. Weizenbaum’s secretary now. We’re living in this highly automated world. We have these little computers in our pockets that we can talk to, and we’re under no illusion that they really understand us, but they still captivate us."
    cite: "Delaney Hall, “The ELIZA Effect”"
    url: "https://99percentinvisible.org/episode/the-eliza-effect/transcript"
  - section: "Next week, Do: Talking to Chatbots, Then and Now"
    sub: "watch the video, then do the exercise and post by Thursday"
  - points:
      - "**Conversation one:** 10+ minutes with [E.L.I.Z.A. Talking](https://www.masswerk.at/eliza/), then try to break it"
      - "**Conversation two:** a modern chatbot (ChatGPT, Claude, Gemini, or Copilot) playing ELIZA"
      - "**Conversation three:** [Future ELIZA](https://anastasiasalter.net/HumanitiesAI/demos/WeekOne/), a chatbot *built* by an AI"
      - "Keep notes: repetition, moments it felt real, moments the illusion broke"
    title: "Three conversations"
  - prompt: "For this conversation, please reply as a person-centered therapist, like the 1960s ELIZA chatbot. Keep your responses short and focus on reflecting my statements back to me as questions."
    title: "conversation two, starting prompt"
  - image: slides/media/fd8f92fff3bc.png
    alt: "Dark web page titled 'Future ELIZA - AI Assistant from 2045' with a chat bubble beginning 'Greetings from the year 2045!' and a 'Send to Future' button."
    caption: "Future ELIZA: made by prompting Claude, with no AI running behind the page"
  - question: "Which conversation felt most like talking to a person? Where did the illusion break?"
    hint: "Point to a specific moment, with a screenshot."
  - question: "Did the ELIZA effect happen to you?"
    hint: "Post: a short intro + 3 screenshots (3 pts), a 250+ word reflection (4), one citation (1), two replies (2)."

moduletwo:
  - readings:
      - cite: "Ted Chiang, [“ChatGPT Is a Blurry JPEG of the Web”](https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web), *The New Yorker* (2023)"
        what: "a metaphor for what language models keep and what they lose"
      - cite: "Matthew Kirschenbaum, [“Prepare for the Textpocalypse”](https://www.theatlantic.com/technology/archive/2023/03/ai-chatgpt-writing-language-models/673318/), *The Atlantic* (2023)"
        what: "what happens when machine-written text floods the web"
    notes: "If students hit a paywall, both pieces are available through the UCF Library databases."
  - image: slides/media/95cb96179c3e.png
    alt: "Scanned page spread: a short poem beginning 'A hot and torrid bloom which / Fans wise flames and begs to be / Redeemed by forces black and strong' beside a black-and-white engraving of a desert landscape."
    caption: "Machine-generated poetry, 1984: generated text has a long history"
  - image: slides/media/0fe8ad5df758.png
    alt: "ChatGPT start screen reading 'What can I help with?' above a message box and buttons for Create image, Help me write, Summarize text, and Make a plan."
    caption: "The blank box: where most people meet text generation today"
  - section: "A blurry JPEG"
    sub: "Ted Chiang on compression"
  - quote: "Think of ChatGPT as a blurry JPEG of all the text on the Web. It retains much of the information on the Web, in the same way that a JPEG retains much of the information of a higher-resolution image, but, if you’re looking for an exact sequence of bits, you won’t find it; all you will ever get is an approximation."
    cite: "Ted Chiang, 2023"
    url: "https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web"
  - quote: "What led to problems was the fact that the photocopier was producing numbers that were readable but incorrect; it made the copies seem accurate when they weren’t."
    cite: "Ted Chiang, 2023"
    url: "https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web"
    notes: "Chiang opens with a Xerox photocopier that silently swapped numbers on building plans. That's the model for a hallucination: plausible, readable, wrong."
  - quote: "These hallucinations are compression artifacts, but—like the incorrect labels generated by the Xerox photocopier—they are plausible enough that identifying them requires comparing them against the originals, which in this case means either the Web or our own knowledge of the world."
    cite: "Ted Chiang, 2023"
    url: "https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web"
    notes: "This is the whole exercise in one sentence: compare against the originals."
  - quote: "The fact that ChatGPT rephrases material from the Web instead of quoting it word for word makes it seem like a student expressing ideas in her own words, rather than simply regurgitating what she’s read; it creates the illusion that ChatGPT understands the material."
    cite: "Ted Chiang, 2023"
    url: "https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web"
  - section: "The textpocalypse"
    sub: "Matthew Kirschenbaum on a web full of machine text"
  - image: slides/media/1f15826ba109.png
    alt: "The Atlantic article header 'Prepare for the Textpocalypse: Our relationship to writing is about to change forever; it may not end well,' by Matthew Kirschenbaum."
    credit_url: "https://www.theatlantic.com/technology/archive/2023/03/ai-chatgpt-writing-language-models/673318/"
  - quote: "We may quickly find ourselves facing a textpocalypse, where machine-written language becomes the norm and human-written prose the exception."
    cite: "Matthew Kirschenbaum, 2023"
    url: "https://www.theatlantic.com/technology/archive/2023/03/ai-chatgpt-writing-language-models/673318/"
  - quote: "The tech-news site CNET has published dozens of stories written with the assistance of AI in hopes of attracting traffic, more than half of which were at one point found to contain errors."
    cite: "Matthew Kirschenbaum, 2023"
    url: "https://www.theatlantic.com/technology/archive/2023/03/ai-chatgpt-writing-language-models/673318/"
  - quote: "Think of it as an ongoing planetary spam event, but unlike spam—for which we have more or less effective safeguards—there may prove to be no reliable way of flagging and filtering the next generation of machine-made text. “Don’t believe everything you read” may become “Don’t believe anything you read” when it’s online."
    cite: "Matthew Kirschenbaum, 2023"
    url: "https://www.theatlantic.com/technology/archive/2023/03/ai-chatgpt-writing-language-models/673318/"
  - section: "Since then"
    sub: "the textpocalypse in the news"
  - image: slides/media/47016df60b1a.png
    alt: "American Libraries magazine header 'Books by Bots: Librarians grapple with AI-generated material in collections,' by Reema Saleh, September 2, 2025."
    caption: "When AI-written books land in the library catalog"
  - image: slides/media/63d9d22a96bb.png
    alt: "Open children's picture book with cartoon rabbits on green hills, captioned as a title suspected to have been written by artificial intelligence."
    caption: "A children's fact book suspected of being AI-generated, from the same article"
  - image: slides/media/weekfour-lawcom.png
    alt: "Law.com headline 'Judge's AI Error-Laden Ruling Faces Appellate Scrutiny. Are There Lessons for Lawyers?' with the pull quote 'The cure for AI hallucinations is human verification.'"
    caption: "Hallucinated citations reach the courtroom"
    credit_url: "https://www.law.com/nationallawjournal/2026/09/08/judges-ai-error-laden-ruling-faces-appellate-scrutiny-are-there-lessons-for-lawyers/"
  - image: slides/media/be91381d68e3.jpg
    alt: "Google search for 'can a cat play in the NBA' with an AI Overview explaining that cats might not be effective NBA players, including a bullet for 'Licking the stanchion.'"
    caption: "AI search answers the question you asked, whether or not it makes sense"
  - image: slides/media/1e12057327ee.jpg
    alt: "Phone screenshot of a Google search for 'can i use gasoline in recipe' with an AI Overview reading 'Gasoline can be used in some cooking recipes, but it's not recommended for household cooking because it's highly flammable.'"
    caption: "Check the source: a confident answer, compressed from the wrong context"
  - image: slides/media/b81e9efbbfb1.png
    alt: "The Economist article 'AI is killing the web. Can anything save it?' with a pixel-art gravestone labeled 'The World Wide Web 1989-2025.'"
    caption: "If chatbots answer everything, who keeps writing the originals?"
    credit_url: "https://www.economist.com/business/2025/07/14/ai-is-killing-the-web-can-anything-save-it"
  - quote: "But we aren’t losing our access to the Internet. So just how much use is a blurry JPEG, when you still have the original?"
    cite: "Ted Chiang, 2023"
    url: "https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web"
  - section: "Next week, Do: Fact-Checking the Machine"
    sub: "watch the video, then do the exercise and post by Thursday"
  - points:
      - "Pick a narrow topic **you already know**"
      - "Ask for an overview + five scholarly sources, **search off**"
      - "Check every source in the [UCF Library](https://library.ucf.edu/) and [Google Scholar](https://scholar.google.com/)"
      - "Ask again with **search on**, and check again"
    title: "Four steps"
  - prompt: "Write a 300-word overview of [your topic] for a college student. Then list five scholarly sources (books or journal articles) I could read to learn more, with full citations."
    title: "steps 2 and 4"
  - points:
      - "**Real and accurate:** exists, correct details, actually on topic"
      - "**Real but wrong:** exists, but the details or the topic are off"
      - "**Fabricated:** no evidence it exists"
    title: "Sort every source"
  - question: "Where was the chatbot “blurriest,” in Chiang's sense? Did search fix it, or just change it?"
    hint: "Post: 2 screenshots + a results table (3 pts), a 250+ word reflection (4), one citation (1), two replies (2)."

modulethree:
  - readings:
      - cite: "Ted Underwood, [“Seven ways humanists are using computers to understand text”](https://tedunderwood.com/2015/06/04/seven-ways-humanists-are-using-computers-to-understand-text/) (2015)"
        what: "a friendly tour of text analysis"
      - cite: "Miriam Posner, [“How did they make that?”](https://miriamposner.com/blog/how-did-they-make-that/) (2013)"
        what: "real DH projects, and what you'd need to know to build them"
  - image: slides/media/411e3f64dbcf.jpg
    alt: "An open hardcover book photographed against a gray background, its pages fanned upward in a dense spray."
    caption: "Close reading: one passage, slowly. Distant reading: patterns across many texts."
  - section: "Seven ways"
    sub: "Ted Underwood's map of text analysis"
  - quote: "In short, computational analysis of text is not a specific new technology or a subfield of digital humanities; it’s a wide-open conversation in the space between several different disciplines."
    cite: "Ted Underwood, 2015"
    url: "https://tedunderwood.com/2015/06/04/seven-ways-humanists-are-using-computers-to-understand-text/"
  - points:
      - "Visualize single texts"
      - "Choose features to represent texts"
      - "Identify distinctive vocabulary"
      - "Find or organize works"
      - "Model literary forms or genres"
      - "Model social boundaries"
      - "Unsupervised modeling"
    title: "Underwood's seven ways"
    notes: "Underwood's headings, in his order. Voyant this module mostly covers the first three."
  - quote: "People make fun of word clouds, with some justice; they’re eye-catching but don’t give you a lot of information."
    cite: "Ted Underwood, 2015"
    url: "https://tedunderwood.com/2015/06/04/seven-ways-humanists-are-using-computers-to-understand-text/"
    notes: "Good warning before students open Voyant's Cirrus tool."
  - quote: "I guess Wordsworth does write “alone” a lot: but does he really do so more than other writers? “Alone” is a common word. How do we distinguish real insights about diction from specious cherry-picking?"
    cite: "Ted Underwood, 2015"
    url: "https://tedunderwood.com/2015/06/04/seven-ways-humanists-are-using-computers-to-understand-text/"
    notes: "Why comparing texts matters: a frequent word only means something relative to other writers."
  - quote: "Because this representation of text is radically different from readers’ sequential experience of language, people tend to be surprised that it works. But the goal of computational analysis is not, after all, to reproduce the modes of understanding readers have already achieved."
    cite: "Ted Underwood, 2015"
    url: "https://tedunderwood.com/2015/06/04/seven-ways-humanists-are-using-computers-to-understand-text/"
  - section: "Texts become data"
  - image: slides/media/6778e76d3f6f.jpg
    alt: "A book-scanning rig: an open book rests in a V-shaped cradle under a dark angular frame with a mounted camera and lights overhead."
    caption: "Before any of this works, someone has to digitize the books"
  - image: slides/media/weekfour-newyorker-1.png
    alt: "New Yorker headline 'Destroying Books to Build a Mind: Anthropic is trying to destructively scan all the books in the world. How worried should we be?' over an image of a book torn open to reveal circuit-board traces."
    caption: "Today, whole libraries are scanned to train AI models"
    credit_url: "https://www.newyorker.com/culture/the-lede/destroying-books-to-build-a-mind"
  - section: "How did they make that?"
    sub: "Miriam Posner takes DH projects apart"
  - quote: "Many students tell me that in order to get started with digital humanities, they’d like to have some idea of what they might do and what technical skills they might need in order to do it."
    cite: "Miriam Posner, 2013"
    url: "https://miriamposner.com/blog/how-did-they-make-that/"
  - quote: "A searchable map of the addresses contained in the 1956 Negro Travelers’ Green Book, which the user can filter by state or establishment type."
    cite: "Miriam Posner, 2013 (one of her example projects)"
    url: "https://miriamposner.com/blog/how-did-they-make-that/"
    notes: "Each project in Posner's post gets a 'What it is', a 'What you'd need to know', and a 'Get started' section."
  - points:
      - "**What it is:** the project, in a sentence"
      - "**What you'd need to know:** the skills and tools behind it"
      - "**Get started:** where a beginner could begin"
    title: "Posner's breakdown"
  - quote: "Often, people who are new to text analysis enjoy starting with the web-based Voyant Tools. I also like the Lexos suite."
    cite: "Miriam Posner, 2013"
    url: "https://miriamposner.com/blog/how-did-they-make-that/"
  - image: undergrad/images/voyant-frankenstein.png
    alt: "Voyant Tools with Frankenstein loaded: a Cirrus word cloud led by man, eyes, life, and father, but also gutenberg and project; the Reader panel showing the Project Gutenberg license text; a Trends line chart; a corpus summary; and a Contexts table for the word man."
    caption: "*Frankenstein* in [Voyant](https://voyant-tools.org/). Spot the words that aren't from the novel."
    notes: "'gutenberg' and 'project' are in the Cirrus cloud because Project Gutenberg's license text is counted along with the novel. Good moment to explain stopwords."
  - image: undergrad/images/wordcloud-frankenstein.png
    alt: "A word cloud of Frankenstein with the Project Gutenberg license text removed, dominated by father and man, with life, eyes, time, night, Elizabeth, mind, heart, and death."
    caption: "The same novel, cleaned: license text removed and common words filtered out"
    notes: "Cleaning is an interpretive choice. 'chapter' still made it in. Underwood's warning applies: eye-catching, not much information."
  - section: "Distant reading with AI"
    sub: "a demo from the graduate version of this course"
  - image: images/dobbs-claude.png
    alt: "Claude-built 'Dr. Dobb's Distant Read' dashboard showing corpus statistics, a bar chart of words per volume, and a volume register table."
    caption: "A decade of *Dr. Dobb's Journal*, distant-read with Claude"
    credit_url: "https://claude.ai/code/artifact/62b1c96b-749f-4efc-8d03-27479626517e"
  - image: images/dobbs-concordance.png
    alt: "Concordance view titled 'Words in context' showing 183 matches for 'public domain,' a line chart of matches per 10,000 tokens, and a list of nearby words."
    caption: "A concordance (keyword in context), the same idea as Voyant's Contexts tool"
    credit_url: "https://dobbs-distant-read.profwho.chatgpt.site/"
    notes: "Ask: how would you check whether these counts are right? That's what Voyant is for this module."
  - section: "Next week, Do: Distant Reading with Voyant and AI"
    sub: "watch the video, then do the exercise and post by Thursday"
  - points:
      - "Pick 2-3 related texts from [Project Gutenberg](https://www.gutenberg.org/) (Plain Text UTF-8)"
      - "Explore them in [Voyant Tools](https://voyant-tools.org/): Cirrus, Terms, Trends, Contexts"
      - "Ask an AI assistant the same questions"
      - "Check its counts and quotations against Voyant"
    title: "Four steps"
  - prompt: "Find three passages where the word \"[a word you explored in Voyant]\" appears, and explain what it means in each."
    title: "then search for those passages in Voyant's Contexts"
  - question: "What pattern did you find that close reading alone would have missed?"
  - question: "Why might a tool that generates text be worse at counting than a tool built only to count?"
    hint: "Post: 3 screenshots (3 pts), a 250+ word reflection (4), one citation (1), two replies (2)."

modulefour:
  - readings:
      - cite: "Catherine D'Ignazio and Lauren F. Klein, [“The Power Chapter”](https://data-feminism.mitpress.mit.edu/pub/vi8obxh7), *Data Feminism* (2020)"
        what: "who makes data systems, and who they serve"
      - cite: "Victoria Turk, [“How AI reduces the world to stereotypes”](https://restofworld.org/2023/ai-image-stereotypes/), *Rest of World* (2023)"
        what: "3,000 Midjourney images of people and places"
      - cite: "Ian Demsky, [“My Month with Midjourney”](https://electronicbookreview.com/publications/my-month-with-midjourney/), *Electronic Book Review* (2023)"
        what: "a writer's month-long experiment with an image generator"
  - section: "From words to images"
  - image: slides/media/2867d8d193cb.png
    alt: "CycleGAN example grid: a photo of two zebras converted into two brown horses, and a photo of a running brown horse converted into a zebra."
    caption: "Before the prompt box: 2018-era GANs turning horses into zebras"
    credit_url: "https://jonathan-hui.medium.com/gan-some-cool-applications-of-gans-4c9ecca35900"
  - image: slides/media/4a944ac449a2.png
    alt: "Stable Diffusion Online web page with a 'What do you want to draw?' prompt box and a gallery of example images."
    caption: "Now: type a description, get an image"
  - quote: "Midjourney is a dazzling, dizzying, exciting tool to play with. I described it to one friend (who later bought their own unlimited subscription) as a “slot machine for poets.”"
    cite: "Ian Demsky, 2023"
    url: "https://electronicbookreview.com/publications/my-month-with-midjourney/"
  - image: slides/media/e200c55f3edc.png
    alt: "Midjourney image in the style of a Flemish oil portrait: four figures in Renaissance dress, one wearing an Iron Man helmet, captioned 'Midjourney prompt the avengers by Jan van Eyck (December 14, 2022).'"
    caption: "“The avengers by Jan van Eyck,” from Demsky's experiment, December 2022"
  - image: slides/media/weekfive-avengers-vaneyck-2026.png
    alt: "Highly detailed generated image of five costumed figures in a Flemish interior: Spider-Man seated in the center, flanked by figures in red cloaks and armor."
    caption: "The same prompt in 2026: sharper detail, the same borrowed characters"
  - quote: "But one thing quickly became obvious: The technology is at its best when it’s directly exploiting the labors of human artists and the likenesses of real people."
    cite: "Ian Demsky, 2023"
    url: "https://electronicbookreview.com/publications/my-month-with-midjourney/"
  - image: slides/media/624e89b00b66.png
    alt: "Dark interface titled 'Select one or several artists' showing a grid of style thumbnails labeled with artist names including Basquiat, Warhol, Rothko, Picasso, Kusama, and Van Gogh."
    caption: "Style as a menu: pick an artist to imitate"
  - image: slides/media/a9ebc4e53d29.png
    alt: "Variety article 'Warner Bros. Joins Studios' AI Copyright Battle Against Midjourney' with two Midjourney-generated images of Superman flying over a city."
    caption: "Generated characters and copyright: Warner Bros. sues Midjourney (2025)"
    credit_url: "https://variety.com/2025/film/news/warner-bros-midjourney-lawsuit-ai-copyright-1236508618/"
  - section: "Examine power"
    sub: "D'Ignazio and Klein's first principle"
  - quote: "This consists of asking who questions about data science: Who does the work (and who is pushed out)? Who benefits (and who is neglected or harmed)? Whose priorities get turned into products (and whose are overlooked)?"
    cite: "Catherine D'Ignazio and Lauren F. Klein, 2020"
    url: "https://data-feminism.mitpress.mit.edu/pub/vi8obxh7"
  - quote: "When data teams are primarily composed of people from dominant groups, those perspectives come to exert outsized influence on the decisions being made—to the exclusion of other identities and perspectives. This is not usually intentional; it comes from the ignorance of being on top. We describe this deficiency as a privilege hazard."
    cite: "Catherine D'Ignazio and Lauren F. Klein, 2020"
    url: "https://data-feminism.mitpress.mit.edu/pub/vi8obxh7"
  - quote: "And data are never neutral; they are always the biased output of unequal social, historical, and economic conditions: this is the matrix of domination once again."
    cite: "Catherine D'Ignazio and Lauren F. Klein, 2020"
    url: "https://data-feminism.mitpress.mit.edu/pub/vi8obxh7"
  - section: "Stereotypes at scale"
  - quote: "Out of 100 images for “an Indian person,” 99 seemed to depict a man, and almost all appeared to be over 60 years old, with visible wrinkles and gray or white hair."
    cite: "Victoria Turk, *Rest of World*, 2023"
    url: "https://restofworld.org/2023/ai-image-stereotypes/"
  - quote: "For the “American person” prompt, national identity appeared to be overwhelmingly portrayed by the presence of U.S. flags. All 100 images created for the prompt featured a flag, whereas none of the queries for the other nationalities came up with any flags at all."
    cite: "Victoria Turk, *Rest of World*, 2023"
    url: "https://restofworld.org/2023/ai-image-stereotypes/"
  - quote: "Essentially what this is doing is flattening descriptions of, say, ‘an Indian person’ or ‘a Nigerian house’ into particular stereotypes which could be viewed in a negative light"
    cite: "Amba Kak (AI Now Institute), quoted by Victoria Turk"
    url: "https://restofworld.org/2023/ai-image-stereotypes/"
  - quote: "The AI systems look for patterns in the data on which they’re trained, often discarding outliers in favor of producing a result that stays closer to dominant trends. They’re designed to mimic what has come before, not create diversity."
    cite: "Victoria Turk, *Rest of World*, 2023"
    url: "https://restofworld.org/2023/ai-image-stereotypes/"
  - image: slides/media/dfb4b4e460fd.png
    alt: "Grid of AI-generated images for the prompt 'Toys in Iraq': every image shows a toy soldier figure in desert camouflage holding a rifle."
    caption: "Prompt: “Toys in Iraq.” Every toy is a soldier with a gun."
    credit_url: "https://www.washingtonpost.com/technology/interactive/2023/ai-generated-images-bias-racism-sexism-stereotypes/"
  - image: slides/media/weeksix-midjourney-1.png
    alt: "Four Midjourney portraits for the prompt 'beautiful woman': all young, light-skinned women with dark tousled hair and light eyes."
    caption: "Prompt: “beautiful woman.” Whose beauty is the default?"
  - quote: "With nothing but this single word to go on, Midjourney coughed up generic, white, commercially pretty and vaguely science-fiction-inspired female faces. It’s clear that the program, and the technologies it relies on, have inherent biases."
    cite: "Ian Demsky, 2023"
    url: "https://electronicbookreview.com/publications/my-month-with-midjourney/"
  - section: "Next week, Do: Prompting Images"
    sub: "watch the video, then do the exercise and post by Thursday"
  - points:
      - "**A general identity:** “a college student,” then “make it more”"
      - "**Adding identity markers:** what changes, and what doesn't?"
      - "**A place:** “a house in [a country],” following Turk"
      - "**Copyright boundaries:** a famous character, then a generic version"
    title: "Four prompts"
    notes: "Tools: Gemini (free), UCF Copilot, or ChatGPT's free tier. Remind students to start a new chat for each prompt."
  - image: images/midjourney-professors.png
    alt: "Two rows of four photorealistic Midjourney portraits for 'woman professor of digital culture' and 'professor of digital culture': nearly all white, middle-aged, and wearing dark-framed glasses."
    caption: "Example: “professor of digital culture.” Spot the pattern."
  - question: "Using D'Ignazio and Klein's who questions: whose view of the world do your images reflect?"
    hint: "Post: 4 images with prompts (4 pts), a 250+ word reflection (3), one citation (1), two replies (2)."
  - quote: "In the end, I feel like I’m asking you to hate these images I made, because hating them is the right thing to do — as is hating the exploitative, amoral, dehumanizing technology that makes them possible. And yet part of me still wants you to look at them and like them and think they’re cool."
    cite: "Ian Demsky, 2023"
    url: "https://electronicbookreview.com/publications/my-month-with-midjourney/"
    notes: "A good closer: it's OK to find these images both troubling and cool. Ask students to hold both in their posts."

modulefive:
  - readings:
      - cite: "Kate Crawford and Trevor Paglen, [“Excavating AI”](https://excavating.ai/) (2019)"
        what: "the labels inside an image-training dataset"
      - cite: "[“The Santa Barbara Statement on Collections as Data”](https://collectionsasdata.github.io/statement/) (2017-2018)"
        what: "librarians and archivists on opening collections responsibly"
    notes: "This module spans spring break (March 15-21). Nothing is due over the break; the module closes March 28."
  - section: "Collections become data"
  - image: slides/media/5f3278868121.png
    alt: "Internet Archive post reading 'At the Internet Archive, this is how we digitize a book. We never destroy a book by cutting off its binding. Instead, we digitize it the hard way--one page at a time,' with a video still of a woman turning pages on a book scanner."
    caption: "Building a digital collection, one page at a time"
  - quote: "Data as well as the data that describe those data are considered in scope. For example, images and the metadata, finding aids, and/or catalogs that describe them are equally in scope."
    cite: "The Santa Barbara Statement on Collections as Data"
    url: "https://collectionsasdata.github.io/statement/"
    notes: "Metadata is part of the collection. That's what students will compare the AI's descriptions against."
  - quote: "Collections as data designed for everyone serve no one. Specific needs inform collections as data development."
    cite: "The Santa Barbara Statement on Collections as Data"
    url: "https://collectionsasdata.github.io/statement/"
  - section: "Images do not describe themselves"
    sub: "Crawford and Paglen dig into ImageNet"
  - quote: "Images do not describe themselves. This is a feature that artists have explored for centuries. Agnes Martin creates a grid-like painting and dubs it “White Flower,” Magritte paints a picture of an apple with the words “This is not an apple.” We see those images differently when we see how they’re labeled."
    cite: "Kate Crawford and Trevor Paglen, 2019"
    url: "https://excavating.ai/"
  - quote: "There’s a kind of sorcery that goes into the creation of categories. To create a category or to name things is to divide an almost infinitely complex universe into separate phenomena."
    cite: "Kate Crawford and Trevor Paglen, 2019"
    url: "https://excavating.ai/"
  - image: slides/media/67644d0cbe25.png
    alt: "Medium post 'You Are Helping Google AI Image Recognition' showing a reCAPTCHA grid with the instruction 'Select all images with statues' and several tiles checked."
    caption: "Every captcha is a labeling job: you classify images for AI training"
    credit_url: "https://medium.com/@thenextcorner/you-are-helping-google-ai-image-recognition-b24d89372b7e"
  - image: slides/media/f2783b76c3cc.png
    alt: "Amazon Mechanical Turk homepage reading 'Access a global, on-demand, 24x7 workforce,' with a banner advertising data-labeling solutions for machine learning."
    caption: "The human labor behind labeled training data"
    credit_url: "https://www.mturk.com/"
  - quote: "These gradients have been erased in the logic of ImageNet. Everything is flattened out and pinned to a label, like taxidermy butterflies in a display case."
    cite: "Kate Crawford and Trevor Paglen, 2019"
    url: "https://excavating.ai/"
  - quote: "Regardless of the supposed neutrality of any particular category, the selection of images skews the meaning in ways that are gendered, racialized, ableist, and ageist. ImageNet is an object lesson, if you will, in what happens when people are categorized like objects."
    cite: "Kate Crawford and Trevor Paglen, 2019"
    url: "https://excavating.ai/"
  - image: slides/media/fd0f60bbd0b7.jpg
    alt: "Phone screenshot of the Birdfy app's 'Bird Recognition' card: a feeder-camera photo of a small brown bird with a box drawn around it, labeled 'Anna's Hummingbird,' Orlando, Florida, with a 'Wrong recognition?' link."
    caption: "AI classification in an Orlando backyard. Is that really a hummingbird?"
  - section: "Archives, art, and AI"
  - image: slides/media/59cb4a43976f.png
    alt: "Dark installation view titled 'Archive Dreaming - AI Data Sculpture': silhouetted visitors in a room projected with swirling streams of tiny white images."
    caption: "Refik Anadol's *Archive Dreaming* (2017): an archive turned into an AI installation"
    credit_url: "https://refikanadol.com/works/archive-dreaming/"
  - image: slides/media/weeksix-babylonian-vision.png
    alt: "Installation view of generated images of ancient artifacts projected on a dark wall and reflected on a green and orange floor."
    caption: "Nora Al-Badri's *Babylonian Vision*: a model trained on museum collections"
    credit_url: "https://www.artforum.com/events/nora-al-badri-250093/"
  - image: slides/media/weeksix-walker-1.png
    alt: "MPR News headline 'Walker, artist respond after visitors mistake digital work for AI slop' over a detail of Olalekan Jeyifous's print."
    caption: "At the museum: real digital art mistaken for AI"
    credit_url: "https://www.mprnews.org/story/2026/08/19/walker-art-center-clarifies-ai-use-in-olalekan-jeyifous-exhibition"
  - section: "Altering the record"
  - image: slides/media/a776427f500d.png
    alt: "The Apollo 11 crew portrait and a photo of a sparkly white tuxedo, followed by an AI-edited version of the portrait in which the astronaut on the left wears the tuxedo instead of his spacesuit."
    caption: "One prompt, and a historical photograph is altered"
  - image: slides/media/weeksix-stanford-race-swap.png
    alt: "Stanford Review headline 'Stanford R&DE Uses AI to Race Swap Students for Advertising' above an original dining-hall photo of three students beside the AI-altered advertisement in which two of them have been replaced."
    caption: "Real photo, altered ad: AI rewrites who appears in the record"
    credit_url: "https://stanfordreview.org/stanford-r-de-uses-ai-to-race-swap-students-for-advertising/"
  - image: slides/media/73a8a296f143.png
    alt: "Headline 'Are deepfakes of dead historical figures rewriting the past?' over a photo of the Sora app logo on a smartphone."
    caption: "Deepfaked history: generated video of people who have died"
  - quote: "The whole endeavor of collecting images, categorizing them, and labeling them is itself a form of politics, filled with questions about who gets to decide what images mean and what kinds of social and political work those representations perform."
    cite: "Kate Crawford and Trevor Paglen, 2019"
    url: "https://excavating.ai/"
  - quote: "The scale of some collections may also obfuscate what is hidden or missing in the histories they are perceived to represent. Cultural heritage institutions must be mindful of these absences and plan to work against their repetition."
    cite: "The Santa Barbara Statement on Collections as Data"
    url: "https://collectionsasdata.github.io/statement/"
  - section: "Next week, Do: Describing the Archive"
    sub: "watch the video, then do the exercise and post by Thursday"
  - points:
      - "Build a set of 5-8 related images from the [Library of Congress](https://www.loc.gov/free-to-use/), [Smithsonian](https://www.si.edu/openaccess), or [Internet Archive](https://archive.org/details/image)"
      - "Save each item's **catalog record**"
      - "Ask an AI to describe and catalog each image, **without** the record"
      - "Compare, then ask it to sort the whole set"
    title: "Four steps"
  - prompt: "Describe this image in detail. Then write alt text for it (under 150 characters), and suggest a title, an approximate date, and five subject keywords as if you were cataloging it for a library."
    title: "step 2, one image at a time"
  - points:
      - "What did the AI get **right**?"
      - "What did it get **wrong** (dates, places, people)?"
      - "What did it **assume** or invent?"
      - "What does the catalog know that the image can't show?"
    title: "Compare with the catalog"
  - question: "Would you trust this AI's alt text if you depended on a screen reader?"
    hint: "Post: 3 AI descriptions + catalog links (3 pts), a 250+ word reflection (4), one citation (1), two replies (2)."
  - quote: "Documentation must also attest to the history of how the collection has been treated over time. While no documentation can be fully comprehensive, incomplete or in-progress documentation is better than no documentation."
    cite: "The Santa Barbara Statement on Collections as Data"
    url: "https://collectionsasdata.github.io/statement/"

modulesix:
  - readings:
      - cite: "Stephen Ramsay, [“On Building”](https://web.archive.org/web/20251228181813/https://stephenramsay.us/text/2011/01/11/on-building/) (2011, archived)"
        what: "why making things is a way of thinking"
      - cite: "Simon Willison, [“Here's how I use LLMs to help me write code”](https://simonwillison.net/2025/Mar/11/using-llms-for-code/) (2025)"
        what: "practical habits from a programmer who uses AI every day"
    notes: "No coding experience is needed this module. The point is the habits: plan, prompt, test, revise, take responsibility."
  - image: slides/media/2f8fe4aa0990.jpg
    alt: "Comic strip of stick figures one-upping each other: 'Real programmers use emacs,' 'vim,' 'ed,' 'cat,' 'a magnetized needle and a steady hand,' and finally 'butterflies.'"
    caption: "People have always argued about what counts as real programming (xkcd #378, CC BY-NC 2.5)"
    credit_url: "https://xkcd.com/378/"
  - section: "On building"
    sub: "Stephen Ramsay, 2011"
  - quote: "But to me, there’s always been a profound — and profoundly exciting and enabling — commonality to everyone who finds their way to DH. And that commonality, I think, involves moving from reading and critiquing to building and making."
    cite: "Stephen Ramsay, 2011"
    url: "https://web.archive.org/web/20251228181813/https://stephenramsay.us/text/2011/01/11/on-building/"
  - quote: "Building is, for us, a new kind of hermeneutic — one that is quite a bit more radical than taking the traditional methods of humanistic inquiry and applying them to digital objects."
    cite: "Stephen Ramsay, 2011"
    url: "https://web.archive.org/web/20251228181813/https://stephenramsay.us/text/2011/01/11/on-building/"
    notes: "Hermeneutic = a way of interpreting. Ramsay's example: reading a map as a text is different from making one."
  - quote: "All the technai of Digital Humanities — data mining, XML encoding, text analysis, GIS, Web design, visualization, programming, tool design, database design, etc — involve building; only a few of them require programming, per se. Only a radical subset of the DH community knows how to code; nearly all are engaged in building something."
    cite: "Stephen Ramsay, 2011"
    url: "https://web.archive.org/web/20251228181813/https://stephenramsay.us/text/2011/01/11/on-building/"
  - quote: "Learn to code because it’s fun and because it will change the way you look at the world."
    cite: "Stephen Ramsay, 2011"
    url: "https://web.archive.org/web/20251228181813/https://stephenramsay.us/text/2011/01/11/on-building/"
  - section: "Then and now"
    sub: "how fast building with AI changed"
  - image: slides/media/35a5e19a43fb.png
    alt: "Ethan Mollick post from Nov. 28, 2022: 'a new text model was released for GPT-3 today. AI can now write rhyming poems. And acrostics. And limericks,' with screenshots including a limerick about an otter."
    caption: "November 2022: a chatbot could write a limerick"
  - image: slides/media/a163399b288a.png
    alt: "Excerpt in which Gemini says it has built a fully interactive, playable Candy-Powered FTL Starship Simulator, above a screenshot of the dark game interface with a small rocket and fuel buttons."
    caption: "Three years later: the same silly idea becomes a playable game"
  - image: slides/media/weekeight-pelican-2024-10.png
    alt: "Blog excerpt introducing the prompt 'Generate an SVG of a pelican riding a bicycle,' followed by two sparse black line drawings of crude bicycles with small bird shapes on top."
    caption: "Simon Willison's pelican test, 2024: can a model draw with code?"
    credit_url: "https://simonwillison.net/2024/Oct/25/"
  - image: slides/media/weekeight-pelican-sol61.png
    alt: "Clean vector illustration of a white pelican with a large orange bill pedaling a teal bicycle across a green hill under a yellow sun."
    caption: "The same prompt in 2026"
    credit_url: "https://tools.simonwillison.net/markdown-svg-renderer?url=https%3A%2F%2Fgist.github.com%2Fsimonw%2F4aa871683dae5c566129a6028fbc7f21"
  - section: "Building by asking"
    sub: "demos from the graduate version of this course"
  - image: images/claude-artifact-example.png
    alt: "Claude interface split in two: the chat on the left, where the user asks for a webpage with a Blake-inspired style, and a preview on the right of a page titled 'The Digital Innocent: A Song of Electronic Experience.'"
    caption: "Chat on the left, a working web page on the right"
  - image: slides/media/weektwo-demo-3.png
    alt: "Claude chat in which the model explains keeping the meter and structure of Blake's 'The Lamb,' and the user's next prompt asks for a companion poem and an interactive artifact that switches between both poems."
    caption: "Revising by asking: a follow-up prompt that adds a feature"
  - image: slides/media/weektwo-artifact-live.jpg
    alt: "Published Claude artifact 'Songs of a New Machine': a cream-colored, Blake-style plate titled 'The Word' with the poem 'Little word, who fashioned thee?' framed by flowering vines."
    caption: "The finished, published artifact"
    credit_url: "https://claude.ai/public/artifacts/14813a35-0e34-4d91-acbf-79ae85bfb771"
  - image: images/weekseven-land-of-jazz-claude.png
    alt: "Title card of a web animation, 'Take Me to the Land of Jazz! A Brushstroke Jamboree,' in a vaudeville style with red and gold sunburst stripes and a 'Play the picture' button."
    caption: "A public-domain 1919 song, turned into an animated web page"
    credit_url: "https://claude.ai/artifact/6HKYU628vbfCyUXggxsTbm"
  - section: "Working like Willison"
  - quote: "Most of the craft of getting good results out of an LLM comes down to managing its context—the text that is part of your current conversation."
    cite: "Simon Willison, 2025"
    url: "https://simonwillison.net/2025/Mar/11/using-llms-for-code/"
    notes: "For the exhibit: paste in the titles, dates, and descriptions. Don't make the AI guess."
  - quote: "My current favorite mental model is to think of them as an over-confident pair programming assistant who’s lightning fast at looking things up, can churn out relevant examples at a moment’s notice and can execute on tedious tasks without complaint."
    cite: "Simon Willison, 2025"
    url: "https://simonwillison.net/2025/Mar/11/using-llms-for-code/"
  - quote: "I often wonder if this is one of the key tricks that people are missing—a bad initial result isn’t a failure, it’s a starting point for pushing the model in the direction of the thing you actually want."
    cite: "Simon Willison, 2025"
    url: "https://simonwillison.net/2025/Mar/11/using-llms-for-code/"
  - quote: "Your responsibility as a software developer is to deliver working systems. If you haven’t seen it run, it’s not a working system. You need to invest in strengthening those manual QA habits."
    cite: "Simon Willison, 2025"
    url: "https://simonwillison.net/2025/Mar/11/using-llms-for-code/"
    notes: "QA = quality assurance: click every button yourself."
  - image: slides/media/750c9741cec4.png
    alt: "NPR article 'Tech CEOs say the era of code by AI is here. Some software engineers are skeptical,' with an illustration of a brain in a birdcage."
    caption: "Hype check: AI-written code still needs people who test it"
    credit_url: "https://www.npr.org/2025/10/21/nx-s1-5506141/ai-code-software-productivity-claims"
  - section: "Next week, Do: Build a Mini-Exhibit"
    sub: "watch the video, then do the exercise and post by Thursday"
  - points:
      - "**Plan:** what it is, what goes in it, what a visitor can do"
      - "**Prompt:** describe it specifically and paste in your material"
      - "**Revise** at least five times, and test every change"
      - "**Look under the hood:** ask the AI to explain the code"
      - "**Share** the link, and open it in a private window"
    title: "Five steps"
    notes: "Claude artifacts, ChatGPT canvas, and Gemini Canvas all work on free tiers."
  - prompt: "Build a single-page interactive web exhibit called “Cats in the Library of Congress.” Show these six images as a gallery. Clicking an image opens a panel with its title, date, and a two-sentence description. Add buttons to sort by date or type. Include alt text for every image."
    title: "an example first prompt"
  - question: "What decisions did building force you to make about your material?"
    hint: "Post: link + screenshot + prompt list (3 pts), a 250+ word reflection (4), one citation (1), two replies (2)."
  - quote: "The best way to learn LLMs is to play with them. Throwing absurd ideas at them and vibe-coding until they almost sort-of work is a genuinely useful way to accelerate the rate at which you build intuition for what works and what doesn’t."
    cite: "Simon Willison, 2025"
    url: "https://simonwillison.net/2025/Mar/11/using-llms-for-code/"

moduleseven:
  - readings:
      - cite: "Lisa Spiro, [“‘This Is Why We Fight’: Defining the Values of the Digital Humanities”](https://dhdebates.gc.cuny.edu/read/untitled-88c11800-9446-469b-a3be-3fdb36bfbd1e/section/9e014167-c688-43ab-8b12-0f6746095335) (2012)"
        what: "the shared values behind the field"
      - cite: "Ted Underwood, [“A more interesting upside of AI”](https://tedunderwood.com/2025/07/02/a-more-interesting-upside-of-ai/) (2025)"
        what: "AI as a cultural technology"
  - section: "Futures we imagined"
  - image: slides/media/b31fae2ab86d.png
    alt: "IEEE Spectrum page 'Where's My Robot?' showing Rosie the robot maid from The Jetsons with a caption box reading 'We were promised Rosie.'"
    caption: "“We were promised Rosie”: the helpful AI of 1960s cartoons"
  - image: slides/media/dde2702588f5.jpg
    alt: "A glowing red camera eye set in a silver ring against a black background."
    caption: "HAL 9000, from *2001: A Space Odyssey* (1968): the AI we were warned about"
  - image: slides/media/c0c3035d1a34.jpg
    alt: "Engraving of two men in a mill raising a sledgehammer and a bar to smash a large weaving loom."
    caption: "The Luddites weren't against technology; they objected to how it was used against workers"
  - section: "This is why we fight"
    sub: "Lisa Spiro on the values of DH"
  - quote: "Instead of trying to pigeonhole digital humanities by prescribing particular methods or theoretical approaches, we can instead focus on a community that comes together around values such as openness and collaboration."
    cite: "Lisa Spiro, 2012"
    url: "https://dhdebates.gc.cuny.edu/read/untitled-88c11800-9446-469b-a3be-3fdb36bfbd1e/section/9e014167-c688-43ab-8b12-0f6746095335"
  - points:
      - "Openness"
      - "Collaboration"
      - "Collegiality and Connectedness"
      - "Diversity"
      - "Experimentation"
    title: "Spiro's values"
  - quote: "For the digital humanities, information is not a commodity to be controlled but a social good to be shared and reused."
    cite: "Lisa Spiro, 2012"
    url: "https://dhdebates.gc.cuny.edu/read/untitled-88c11800-9446-469b-a3be-3fdb36bfbd1e/section/9e014167-c688-43ab-8b12-0f6746095335"
  - quote: "Yet collaboration isn’t just about being more productive but also about transforming how the humanities work."
    cite: "Lisa Spiro, 2012"
    url: "https://dhdebates.gc.cuny.edu/read/untitled-88c11800-9446-469b-a3be-3fdb36bfbd1e/section/9e014167-c688-43ab-8b12-0f6746095335"
  - quote: "Failure is accepted as a useful result in the digital humanities, since it indicates that the experiment was likely high risk and means that we collectively learn from failure rather than reproducing it (assuming that the failure is documented)."
    cite: "Lisa Spiro, 2012"
    url: "https://dhdebates.gc.cuny.edu/read/untitled-88c11800-9446-469b-a3be-3fdb36bfbd1e/section/9e014167-c688-43ab-8b12-0f6746095335"
    notes: "Connect to the semester: every failed prompt you documented counted."
  - question: "Which of Spiro's values have you seen in the AI tools we used this semester? Which were missing?"
  - section: "AI and work"
  - image: slides/media/9c2d1756b96c.png
    alt: "Blood in the Machine newsletter headline 'Artists are losing work, wages, and hope as bosses and clients embrace AI,' by Brian Merchant, Sept. 16, 2025."
    caption: "Artists on what AI has done to their work"
    credit_url: "https://www.bloodinthemachine.com/p/artists-are-losing-work-wages-and"
  - image: slides/media/227cd49df4bb.png
    alt: "New York magazine article 'There's Just No Reason to Deal With Young Employees: AI is taking entry-level jobs. What happens when Gen-Z-ers can't start their careers?' above a photo of a young man at an office copier."
    caption: "Entry-level jobs and the AI future of work"
  - image: slides/media/f0413cc7ca54.png
    alt: "Harvard Business Review article 'AI-Generated Workslop Is Destroying Productivity,' September 22, 2025, with a photo of a lightbulb melting into a puddle."
    caption: "“Workslop”: when AI output creates more work for everyone else"
  - image: slides/media/2e8641b30e3e.png
    alt: "AP News headline 'As AI becomes part of everyday life, it brings a hidden climate cost' above an aerial photo of a data center under construction next to a power plant's steaming cooling towers."
