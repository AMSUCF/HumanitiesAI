<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
  <meta charset='utf-8'>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,maximum-scale=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bungee&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/undergrad/assets/undergrad.css?v=' | append: site.github.build_revision | relative_url }}">
  <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
  {% seo %}
</head>

<body class="ug">
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">◐</button>

  <header class="ug-hero">
    <div class="ug-window ug-hero-window">
      <div class="ug-titlebar">
        <span class="ug-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="ug-titlebar-label">ENG3861.EXE</span>
      </div>
      <div class="ug-hero-body">
        <p class="ug-kicker">Welcome to</p>
        <h1 class="ug-title">
          <span class="ug-title-line">Digital Humanities</span>
          <span class="ug-title-small">approaches to</span>
          <span class="ug-title-ai">AI</span>
        </h1>
        <p class="ug-prompt">&gt; ENG 3861 // SPRING 2027 // INSTRUCTOR TBD<span class="ug-cursor" aria-hidden="true">_</span></p>
      </div>
    </div>
    <div class="ug-stickers" aria-hidden="true">
      <span class="ug-sticker ug-sticker--words">Words</span>
      <span class="ug-sticker ug-sticker--images">Images</span>
      <span class="ug-sticker ug-sticker--code">Code</span>
      <span class="ug-sticker ug-sticker--coda">Futures</span>
    </div>
  </header>

  <main class="ug-main">
    <article class="ug-window ug-content">
      <div class="ug-titlebar">
        <span class="ug-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="ug-titlebar-label">syllabus.txt</span>
      </div>
      <div class="ug-content-body">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="ug-footer">
    <p>Digital Humanities Approaches to AI &middot; University of Central Florida &middot; maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></p>
  </footer>
</body>
</html>
